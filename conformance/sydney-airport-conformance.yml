note: >-
  Sydney Airport publishes no API and therefore no API-level conformance surface.
  Every standard asserted below is evidenced by the ForgeRock Access Management
  OpenID Connect Discovery document that fronts the InfoSYD partner portal, or by
  a file live-probed on the public web host. Standards the identity provider
  advertises are capabilities of the vendor product exposed at Sydney Airport's
  integration boundary - they govern authentication only, and none of them makes
  the airport's data interface portable.
